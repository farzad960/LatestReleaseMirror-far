name: Sync latest releases & update README

on:
  # schedule:
  #   - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # -------------------- DELETE OLD RELEASES FOLDER (FRESH START) --------------------
      - name: Delete old releases folder
        run: |
          if [ -d releases ]; then
            git rm -rf releases
            git commit -m "Clean slate: remove all releases" || echo "Nothing to remove"
            git push
          fi

      # -------------------- SYNC RELEASES --------------------
      - name: Sync releases
        run: |
          set -e
          trap 'echo "Error on line $LINENO, exit code $?"' ERR

          git pull --rebase origin HEAD || true

          if [ ! -f repos.txt ]; then
            echo "ERROR: repos.txt not found."
            exit 1
          fi

          grep -v '^#' repos.txt | grep -v '^[[:space:]]*$' | while IFS='|' read -r repo_path filter_pattern; do
            repo_path=$(echo "$repo_path" | xargs)
            filter_pattern=$(echo "$filter_pattern" | xargs)

            echo "========================================="
            echo "Processing: $repo_path"
            echo "Filter: '$filter_pattern'"

            owner=$(echo "$repo_path" | cut -d'/' -f1)
            repo_name=$(echo "$repo_path" | cut -d'/' -f2)
            target_dir="releases/$owner/$repo_name"
            mkdir -p "$target_dir"

            # Get latest release (including pre-releases)
            latest_json=$(curl -s --fail "https://api.github.com/repos/$repo_path/releases?per_page=1" | jq '.[0]')
            
            if [ "$latest_json" = "null" ] || [ -z "$latest_json" ]; then
              echo "  No releases found, skipping."
              continue
            fi

            tag=$(echo "$latest_json" | jq -r '.tag_name')
            prerelease=$(echo "$latest_json" | jq -r '.prerelease')
            date_raw=$(echo "$latest_json" | jq -r '.published_at')
            status="stable"
            [[ "$prerelease" == "true" ]] && status="prerelease"

            echo "  Latest release: $tag ($status)"
            echo "  Downloading matching assets (skipping >100 MB)..."

            # Get assets matching filter
            if [ -z "$filter_pattern" ]; then
              # No filter - download all assets
              while read -r url; do
                filename=$(basename "$url")
                size=$(curl -sL -I "$url" | grep -i content-length | tail -1 | awk '{print $2}' | tr -d '\r')
                if [ -n "$size" ] && [ "$size" -gt 104857600 ]; then
                  echo "    SKIP $filename – $size bytes (>100 MB)"
                  continue
                fi
                echo "    Downloading $filename"
                wget -q --show-progress "$url" -P "$target_dir"
              done < <(echo "$latest_json" | jq -r '.assets[].browser_download_url')
            else
              # With filter - download only matching assets
              while read -r url; do
                filename=$(basename "$url")
                size=$(curl -sL -I "$url" | grep -i content-length | tail -1 | awk '{print $2}' | tr -d '\r')
                if [ -n "$size" ] && [ "$size" -gt 104857600 ]; then
                  echo "    SKIP $filename – $size bytes (>100 MB)"
                  continue
                fi
                echo "    Downloading $filename"
                wget -q --show-progress "$url" -P "$target_dir"
              done < <(echo "$latest_json" | jq -r --arg pat "$filter_pattern" '.assets[].browser_download_url | select(test($pat; "i"))')
            fi

            # Count downloaded files
            count=$(find "$target_dir" -type f ! -name ".version" ! -name ".filter" ! -name "release.json" | wc -l)
            echo "  Downloaded $count files"

            # Save metadata
            echo "$tag" > "$target_dir/.version"
            echo "$filter_pattern" > "$target_dir/.filter"

            printf '{\n' > "$target_dir/release.json"
            printf '  "tag": "%s",\n' "$tag" >> "$target_dir/release.json"
            printf '  "status": "%s",\n' "$status" >> "$target_dir/release.json"
            printf '  "published_at": "%s",\n' "$date_raw" >> "$target_dir/release.json"
            printf '  "filter_pattern": "%s",\n' "$filter_pattern" >> "$target_dir/release.json"
            printf '  "updated_at": "%s"\n' "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$target_dir/release.json"
            printf '}\n' >> "$target_dir/release.json"

            git add "$target_dir"
            git commit -m "Update $repo_path to $tag (filter: $filter_pattern)"
            echo "  Committed: $repo_path -> $tag"
            echo ""
          done

          git push
          echo "All updates pushed."

      # -------------------- UPDATE README --------------------
      - name: Update README between markers
        run: |
          # If README.md does not exist, create it from docs/README.fa.md
          if [ ! -f README.md ]; then
            if [ ! -f docs/README.fa.md ]; then
              echo "ERROR: docs/README.fa.md not found – cannot create README.md"
              exit 1
            fi
            cp docs/README.fa.md README.md
            if ! grep -q "<!-- RELEASES_START -->" README.md; then
              printf '\n<!-- RELEASES_START -->\n' >> README.md
              printf '<!-- RELEASES_END -->\n' >> README.md
            fi
          fi

          if ! grep -q "<!-- RELEASES_START -->" README.md; then
            printf '\n<!-- RELEASES_START -->\n' >> README.md
            printf '<!-- RELEASES_END -->\n' >> README.md
          fi

          TABLE=$(mktemp)
          first=true
          find releases -type f -name ".version" -printf "%h\n" | sort | while read -r repo_dir; do
            asset_count=$(find "$repo_dir" -type f ! -name ".version" ! -name "release.json" ! -name ".filter" | wc -l)
            [ "$asset_count" -eq 0 ] && continue

            owner=$(basename "$(dirname "$repo_dir")")
            repo=$(basename "$repo_dir")
            tag=$(cat "$repo_dir/.version")
            url="https://github.com/$owner/$repo"
            anchor=$(echo "${owner}--${repo}" | tr '[:upper:]' '[:lower:]')

            if [ "$first" = false ]; then
              echo "" >> "$TABLE"
              echo "---" >> "$TABLE"
              echo "" >> "$TABLE"
            fi
            first=false

            echo "<div id=\"$anchor\"></div>" >> "$TABLE"
            echo "" >> "$TABLE"
            echo "### $owner--$repo" >> "$TABLE"
            echo "" >> "$TABLE"
            echo "🔗 [source]($url) – [<code><small>$tag</small></code>](https://github.com/$owner/$repo/releases/tag/$tag)" >> "$TABLE"
            echo "" >> "$TABLE"
            echo "| File | Size | Download |" >> "$TABLE"
            echo "|------|------|----------|" >> "$TABLE"

            find "$repo_dir" -type f ! -name ".version" ! -name "release.json" ! -name ".filter" -printf "%f\n" | sort | while read -r asset; do
              asset_path="$repo_dir/$asset"
              size=$(stat -c%s "$asset_path" 2>/dev/null || stat -f%z "$asset_path" 2>/dev/null)
              if [ "$size" -lt 1048576 ]; then
                s="$((size/1024)) KB"
              else
                sm=$(echo "scale=1; $size / 1048576" | bc)
                s="${sm} MB"
              fi
              link="https://raw.githubusercontent.com/${{ github.repository }}/main/$asset_path"
              echo "| \`$asset\` | $s | [⬇️ Download]($link) |" >> "$TABLE"
            done
          done

          awk -v start="<!-- RELEASES_START -->" -v end="<!-- RELEASES_END -->" -v new="$(cat "$TABLE")" '
            BEGIN { p=1 }
            $0 == start { print; print new; p=0; next }
            $0 == end { p=1; print; next }
            p==1 { print }
          ' README.md > README.tmp && mv README.tmp README.md

          git add README.md
          git diff --staged --quiet || git commit -m "Update README between markers"
          git push
